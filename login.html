<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti CLT - Login</title>
    <link rel="stylesheet" href="login.css">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <!-- Cabeçalho -->
        <div class="login-header">
            <div class="logo">
                <i class="fa-solid fa-hard-hat"></i>
                <span>ANTI CLT</span>
            </div>
            <h2>Acesse sua conta</h2>
            <p>Entre para gerenciar seus serviços e diárias</p>
        </div>

        <!-- Formulário de Login -->
        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label for="password">Senha</label>
                    <a href="esqueceu-senha.html" class="forgot-password">Esqueceu a senha?</a>
                </div>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember">
                <label for="remember">Lembrar de mim</label>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
            <p id="login-message" class="form-message" aria-live="polite"></p>
        </form>

        <!-- Rodapé -->
        <div class="login-footer">
            <p>Ainda não tem uma conta? <a href="cadastro.html" class="link-highlight">Cadastre-se</a></p>
            <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</a>
        </div>
    </div>

    <script src="login.js"></script>

</body>
</html>
